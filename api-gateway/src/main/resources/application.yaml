server:
  port: 8888

app:
  api-prefix: /api/v1
  services:
    identity-service: ${IDENTITY_SERVICE_URL:http://localhost:8080/identity}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      routes:
        - id: identity_service
          uri: http://localhost:8080
          predicates:
            - Path=${app.api-prefix}/identity/**
          filters:
            - StripPrefix=2
        - id: profile_service
          uri: http://localhost:8081
          predicates:
            - Path=${app.api-prefix}/profile/users/**
          filters:
            - StripPrefix=2
        - id: notification_service
          uri: http://localhost:8082
          predicates:
            - Path=${app.api-prefix}/notification/**
          filters:
            - StripPrefix=2
        - id: post_service
          uri: http://localhost:8083
          predicates:
            - Path=${app.api-prefix}/post/**
          filters:
            - StripPrefix=2
        - id: file_service
          uri: http://localhost:8084
          predicates:
            - Path=${app.api-prefix}/file/**
          filters:
            - StripPrefix=2
        - id: chat_service
          uri: http://localhost:8085
          predicates:
            - Path=${app.api-prefix}/chat/**
          filters:
            - StripPrefix=2
        - id: relation_service
          uri: http://localhost:8086
          predicates:
            - Path=${app.api-prefix}/relation/**
          filters:
            - StripPrefix=2
        - id: feed_service
          uri: http://localhost:8087
          predicates:
            - Path=${app.api-prefix}/feed/**
          filters:
            - StripPrefix=2
        - id: socket_service
          uri: http://localhost:8089
          predicates:
            - Path=${app.api-prefix}/ws/**
          filters:
            - StripPrefix=2
  webflux:
    pathmatch:
      matching-strategy: ant_path_matcher

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Identity Service
        url: /api/v1/identity/v3/api-docs
      - name: Profile Service
        url: /api/v1/profile/v3/api-docs
      - name: Notification Service
        url: /api/v1/notification/v3/api-docs
      - name: Post Service
        url: /api/v1/post/v3/api-docs
      - name: File Service
        url: /api/v1/file/v3/api-docs
      - name: Chat Service
        url: /api/v1/chat/v3/api-docs
      - name: Relation Service
        url: /api/v1/relation/v3/api-docs
      - name: Feed Service
        url: /api/v1/feed/v3/api-docs
      - name: Socket Service
        url: /api/v1/ws/v3/api-docs
