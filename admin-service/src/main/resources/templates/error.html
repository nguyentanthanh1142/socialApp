<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Error</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body class="login-body">
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card border-0 shadow-sm p-4 text-center" style="max-width: 420px;">
        <h1 class="h3" th:text="${status}">Error</h1>
        <p class="text-muted" th:text="${message}">Something went wrong</p>
        <a class="btn btn-primary" th:href="@{/}">Back to Dashboard</a>
    </div>
</div>
</body>
</html>
