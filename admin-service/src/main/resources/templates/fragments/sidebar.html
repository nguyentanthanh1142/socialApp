<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="admin-sidebar text-white">
    <div class="sidebar-brand px-3 py-4">
        <i class="bi bi-shield-lock-fill me-2"></i>
        <span class="fw-semibold">NTT Admin</span>
    </div>
    <ul class="nav flex-column px-2">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${activeMenu == 'dashboard'} ? 'active'" th:href="@{/}">
                <i class="bi bi-speedometer2 me-2"></i> Dashboard
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${activeMenu == 'users'} ? 'active'" th:href="@{/users}">
                <i class="bi bi-people me-2"></i> Users
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${activeMenu == 'posts'} ? 'active'" th:href="@{/posts}">
                <i class="bi bi-file-earmark-post me-2"></i> Posts
            </a>
        </li>
    </ul>
</aside>
</body>
</html>
