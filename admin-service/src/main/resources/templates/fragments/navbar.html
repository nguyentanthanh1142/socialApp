<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="navbar" class="admin-navbar border-bottom bg-white px-4 py-3 d-flex justify-content-between align-items-center">
    <div>
        <h1 class="h4 mb-0" th:text="${pageTitle}">Dashboard</h1>
        <small class="text-muted">Admin Management Console</small>
    </div>
    <div class="d-flex align-items-center gap-3">
        <span class="badge text-bg-primary" sec:authentication="name">admin</span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </form>
    </div>
</header>
</body>
</html>
