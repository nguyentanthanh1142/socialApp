server:
  port: 8080
  servlet:
    context-path: /notification
spring:
  application:
    name: notification-service
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
    mongodb:
      uri: ${MONGO_URI_NOTIFICATION_SERVICE:mongodb://my-mongo:27017/notification-service?authSource=admin}
      username: ${MONGO_USERNAME:root}
      password: ${MONGO_PASSWORD:root}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  notification:
    email:
      url: ${EMAIL_SERVICE_URL:https://api.brevo.com}
      apikey: ${BREVO_APIKEY}
      provider: brevoEmailProvider
      sender:
        name: ${NOTIFICATION_SENDER_NAME:Thanh Nguyen}
        email: ${NOTIFICATION_SENDER_EMAIL:nguyentanthanh1142@gmail.com}
      templates:
        welcome_email: ${WELCOME_TEMPLATE_ID:2}
app:
  services:
    post:
      url: ${POST_SERVICE_URL:http://post-service:8080/post}
    profile:
      url: ${PROFILE_SERVICE_URL:http://profile-service:8080/profile}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
