server:
  port: 8089
  servlet:
    context-path: /ws
spring:
  application:
    name: socket-service
  data:
    mongodb:
      uri: ${MONGO_URI_CHAT_SERVICE:mongodb://root:root@localhost:27017/chat-service?authSource=admin}
      username: ${MONGO_USERNAME:root}
      password: ${MONGO_PASSWORD:root}
      auto-index-creation: true
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
app:
  services:
    profile:
      url: ${PROFILE_SERVICE_URL:http://localhost:8081/profile}
    identity:
      url: ${IDENTITY_SERVICE_URL:http://localhost:8080/identity}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
