name: CI/CD Microservices

on:
  push:
    branches:
      - deploy-to-oracle
  workflow_dispatch:
    inputs:
      service:
        description: 'Chỉ build/deploy 1 service (để trống = tất cả)'
        required: false
        default: ''

env:
  ALL_SERVICES: "identity-service chat-service profile-service post-service file-service api-gateway nginx-frontend socket-service admin-service relation-service"
  DEPLOY_DIR: /home/ubuntu/social-app

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set.outputs.services }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - id: set
        env:
          INPUT_SERVICE: ${{ inputs.service }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          LIST=""
          if [ -n "$INPUT_SERVICE" ]; then
            LIST="$INPUT_SERVICE"
          elif [ "$EVENT" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE" "$SHA" | awk -F/ '{print $1}' | sort -u)
            if echo "$CHANGED" | grep -qxE "pom.xml|Dockerfile"; then
              echo "Shared build file changed -> build all"
              LIST="$ALL_SERVICES"
            else
              for s in $ALL_SERVICES; do
                if echo "$CHANGED" | grep -qx "$s"; then LIST="$LIST $s"; fi
              done
            fi
          else
            echo "Manual run / no diff base -> build all"
            LIST="$ALL_SERVICES"
          fi

          if [ -z "$(echo $LIST)" ]; then
            JSON='[]'
          else
            JSON=$(printf '%s\n' $LIST | jq -R . | jq -s -c .)
          fi
          echo "services=$JSON" >> "$GITHUB_OUTPUT"
          echo "Services to build/deploy: $JSON"

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push frontend
        if: matrix.service == 'nginx-frontend'
        uses: docker/build-push-action@v6
        with:
          context: nginx-frontend
          file: nginx-frontend/Dockerfile
          push: true
          build-args: |
            REACT_APP_API_GATEWAY=https://api.social.thanhbuilds.me/api/v1
            REACT_APP_CLIENT_ID=681874681914-2v5tnop8m
            REACT_APP_AUTH_REDIRECT_URL=https://social.thanhbuildtehclnvfmasmnou3qqn5b45v.apps.googleusercontent.cos.me/authenticated
            REACT_APP_SOCKET_URL=https://socket.social.thanhbuilds.me
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nginx-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/nginx-frontend:${{ github.sha }}
          cache-from: type=gha,scope=nginx-frontend
          cache-to: type=gha,mode=max,scope=nginx-frontend

      # Spring services: dùng Dockerfile gốc + MODULE (giống docker-compose local)
      - name: Build & push Spring service
        if: matrix.service != 'nginx-frontend'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            MODULE=${{ matrix.service }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: [self-hosted, oracle]          # runner cài trên VM Oracle, gắn label "oracle"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Sync compose files
        run: |
          cp docker-compose.prod.yml Caddyfile "$DEPLOY_DIR/"

      - name: Deploy with docker compose
        working-directory: ${{ env.DEPLOY_DIR }}
        env:
          SERVICES_JSON: ${{ needs.detect-changes.outputs.services }}
        run: |
          SERVICES=$(echo "$SERVICES_JSON" | jq -r 'join(" ")')
          echo "Deploying: $SERVICES"
          docker compose -f docker-compose.prod.yml pull $SERVICES
          docker compose -f docker-compose.prod.yml up -d $SERVICES
          docker image prune -f
          docker compose -f docker-compose.prod.yml ps