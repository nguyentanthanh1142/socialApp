name: CI/CD Microservices

on:
  push:
    branches:
      - deploy-to-ec2
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (optional)'
        required: false
        default: ''
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set.outputs.services }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - id: set
        run: |
          echo "Detecting changed services..."
          
          if git rev-parse ${{ github.event.before }} >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | awk -F/ '{print $1}' | sort | uniq)
          else
            echo "Fallback: deploy all services"
            CHANGED="identity-service chat-service profile-service"
          fi
          
          FILTERED=$(echo "$CHANGED" | grep -E "identity-service|chat-service|profile-service|post-service|file-service|api-gateway|nginx-frontend" || true)
          
          JSON_ARRAY=$(echo "$FILTERED" | jq -R -s -c 'split("\n")[:-1]')
          
          echo "services=$JSON_ARRAY" >> $GITHUB_OUTPUT
          echo "Services to build/deploy: $FILTERED"

  build:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Docker image
        run: |
          echo "Building ${{ matrix.service }}..."
          docker build --cache-from ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }} \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }} \
            -f ${{ matrix.service }}/Dockerfile .

      - name: Login to docker hub
        run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_PASSWORD}}

      - name: Publish image to docker hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}

  deploy:
    needs:
      - detect-changes
      - build
    runs-on: [aws-ec2]
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Copy .env
        run: cp /home/ubuntu/.env ./.env

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq
          yq --version

      # Check out to read file

      - name: Load config
        run: |
          # yq to read deploy-config.yml for current service port and kafka settings
          # default select file at root of repo
          export PORT=$(yq e ".${{ matrix.service }}.port" deploy-config.yml)   
          export KAFKA=$(yq e ".${{ matrix.service }}.kafka" deploy-config.yml)
          echo "PORT=$PORT" >> $GITHUB_ENV
          echo "KAFKA=$KAFKA" >> $GITHUB_ENV

      - name: Stop existing container if running
        run: |
          if [ $(docker ps -q -f name=${{ matrix.service }}) ]; then
          docker stop ${{ matrix.service }}
          docker rm ${{ matrix.service }}
          fi
      - name: Pull Image from docker hub
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest

      - name: Run docker container
        run: |
          if [ "${{ matrix.service }}" = "nginx-frontend" ]; then
            docker run -d \
            --name ${{ matrix.service }} \
            --network app-network \
            -p $PORT:80 \
            --env-file .env \
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
          else         
            docker run -d \
              --name ${{matrix.service}} \
              --network app-network \
              -p $PORT:8080 \
              --env-file .env \
              -e SPRING_PROFILES_ACTIVE=docker \
              ${{ secrets.DOCKER_USERNAME }}/${{matrix.service}}:latest
          fi 
          if [ "$KAFKA" = "true" ]; then
            docker network connect kafka-net ${{ matrix.service }}
          fi
