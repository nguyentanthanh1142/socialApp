# =====================================================================
# BASE: chỉ chứa thứ dùng chung (build, profile, network, depends_on,
# healthcheck, cấu hình infra). KHÔNG có ports / env app / limit.
#   - local: tự merge với docker-compose.override.yaml
#   - prod : dùng riêng docker-compose.prod.yml (không dùng file này)
# Chạy local: docker compose --profile infra --profile app up -d
# Yêu cầu Docker Engine 25+ / Compose 2.20+ (do start_interval)
# =====================================================================

x-healthcheck-root: &healthcheck-root
  test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 90s
  start_interval: 3s

