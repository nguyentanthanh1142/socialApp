x-app: &app
  profiles: ["app"]
  restart: unless-stopped
  networks:
    - app-network
  healthcheck: *healthcheck-root

services:
  # ============== APP SERVICES ==============
  nginx-frontend:
    profiles: [ "app" ]
    restart: unless-stopped
    networks:
      - app-network
    build:
      context: nginx-frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_GATEWAY: ${REACT_APP_API_GATEWAY}
        REACT_APP_CLIENT_ID: ${REACT_APP_CLIENT_ID}
        REACT_APP_AUTH_REDIRECT_URL: ${REACT_APP_AUTH_REDIRECT_URL}
        REACT_APP_SOCKET_URL: ${REACT_APP_SOCKET_URL}
    image: nonono000/nginx-frontend:${VERSION}

  api-gateway:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: api-gateway
    image: nonono000/api-gateway:${VERSION}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 3s

  identity-service:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: identity-service
    image: nonono000/identity-service:${VERSION}
    networks:
      - app-network
      - kafka-net
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *healthcheck-identity

  post-service:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: post-service
    image: nonono000/post-service:${VERSION}
    networks:
      - app-network
      - kafka-net
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *healthcheck-post

  profile-service:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: profile-service
    image: nonono000/profile-service:${VERSION}
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck: *healthcheck-profile

  file-service:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: file-service
    image: nonono000/file-service:${VERSION}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck: *healthcheck-file

  chat-service:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: chat-service
    image: nonono000/chat-service:${VERSION}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *healthcheck-chat

  socket-service:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: socket-service
    image: nonono000/socket-service:${VERSION}
    networks:
      - app-network
      - kafka-net
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *healthcheck-ws

  admin-service:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: admin-service
    image: nonono000/admin-service:${VERSION}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck: *healthcheck-admin

  relation-service:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: relation-service
    image: nonono000/relation-service:${VERSION}
    networks:
      - app-network
      - kafka-net
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *healthcheck-relation

  # ============== INFRASTRUCTURE SERVICES ==============
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    profiles: [ "infra" ]
    networks:
      - kafka-net
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "*"
    healthcheck:
      test: [ "CMD", "cub", "zk-ready", "localhost:2181", "5" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 3s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    profiles: ["infra"]
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - kafka-net
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
      start_interval: 5s

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    profiles: [ "infra" ]
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-net
    volumes:
      - ./init-topics.sh:/init-topics.sh
    command: [ "bash", "/init-topics.sh" ]
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    profiles: ["infra"]
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-net
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  mysql:
    image: mysql:8.0
    container_name: mysql-app
    profiles: ["infra"]
    networks:
      - app-network
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: identity_db
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
      start_interval: 3s

  mongodb:
    image: mongo:7.0
    container_name: my-mongo
    profiles: ["infra"]
    networks:
      - app-network
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --quiet --eval 'db.adminCommand(\"ping\").ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
      start_interval: 3s

  neo4j:
    image: neo4j:5.20-community
    container_name: my-neo4j
    profiles: ["infra"]
    networks:
      - app-network
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
      start_interval: 3s

  redis:
    image: redis:7.2-alpine
    container_name: redis
    profiles: ["infra"]
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 2s

networks:
  app-network:
    driver: bridge
  kafka-net:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
  neo4j_data: