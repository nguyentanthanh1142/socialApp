server:
  port: 8080
  servlet:
    context-path: /file
spring:
  application:
    name: file-service
  data:
    mongodb:
      uri: ${MONGO_URI_FILE_SERVICE:mongodb://root:root@mongo:27017/file-service?authSource=admin}
app:
  file:
    storage-dir: ${FILE_STORAGE_DIR:/app/uploads}
    download-prefix: ${DOWNLOAD_PREFIX:http://localhost:8888/api/v1/file/media/download/}
