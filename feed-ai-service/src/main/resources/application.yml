server:
  port: 8088
spring:
  application:
    name: feed-ai-service
  ai:
    openai:
      api-key: ${GEMINI_KEY}
      chat:
        base-url: https://generativelanguage.googleapis.com/v1beta/openai/
        completion-path: /v1beta/openai/chat/completions
        options:
          model: gemini-2.0-flash