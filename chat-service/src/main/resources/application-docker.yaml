server:
  port: 8080
  servlet:
    context-path: /chat
spring:
  application:
    name: chat-service
  data:
    mongodb:
      uri: ${MONGO_URI_CHAT_SERVICE}
      username: ${MONGO_USERNAME:root}
      password: ${MONGO_PASSWORD:root}
      auto-index-creation: true

app:
  services:
    profile:
      url: ${PROFILE_SERVICE_URL:http://profile-service:8081/profile}
    identity:
      url: ${IDENTITY_SERVICE_URL:http://identity-service:8080/identity}