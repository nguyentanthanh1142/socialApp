services:
  nginx-frontend:
    ports:
      - "3000:80"

  api-gateway:
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DBMS_CONNECTION: ${DBMS_CONNECTION}
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      SERVER_PORT: 8080
    ports:
      - "8888:8080"

  identity-service:
    environment:
      DBMS_CONNECTION: ${DBMS_CONNECTION}
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      PROFILE_SERVICE_URL: ${PROFILE_SERVICE_URL}
      AUTH_REDIRECT_URL: ${AUTH_REDIRECT_URL}
      CLIENT_ID: ${CLIENT_ID}
      SECRET_KEY: ${SECRET_KEY}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8080"

  post-service:
    environment:
      MONGO_URI_POST_SERVICE: ${MONGO_URI_POST_SERVICE}
    ports:
      - "8083:8080"

  profile-service:
    environment:
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      FILE_SERVICE_URL: ${FILE_SERVICE_URL}
    ports:
      - "8081:8080"

  file-service:
    environment:
      MONGO_URI_FILE_SERVICE: ${MONGO_URI_FILE_SERVICE}
      FILE_STORAGE_DIR: ${FILE_STORAGE_DIR}
      DOWNLOAD_PREFIX: ${DOWNLOAD_PREFIX}
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8084:8080"

  chat-service:
    environment:
      MONGO_URI_CHAT_SERVICE: ${MONGO_URI_CHAT_SERVICE}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      PROFILE_SERVICE_URL: ${PROFILE_SERVICE_URL}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
    ports:
      - "8085:8080"
      - "8999:8999"

  zookeeper:
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka:
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,PLAINTEXT_HOST://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT

  kafka-ui:
    ports:
      - "8089:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181

